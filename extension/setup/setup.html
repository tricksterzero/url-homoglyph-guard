<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Homoglyph Guard の設定</title>
  <link rel="stylesheet" href="../warning/warning.css">
</head>
<body>
  <main>
    <div class="title">
      <h1>URL Homoglyph Guard の設定</h1>
    </div>

    <h2>すべてのサイトへのアクセス</h2>
    <p>
      開こうとしたページのドメインを読み込み前に確認するため、すべてのサイトへのアクセスを許可してください。
      ページの内容を読んだり、外部へ送信したりはしません。
    </p>
    <p class="note" id="host-status"></p>
    <div class="buttons start">
      <button type="button" class="primary" id="grant">許可する</button>
    </div>

    <h2>プライベートウィンドウ</h2>
    <p>
      Firefox の拡張機能は、既定ではプライベートウィンドウで動きません。プライベートウィンドウでも警告するには、
      アドオンの管理画面（about:addons）でこの拡張機能の詳細を開き、プライベートウィンドウでの実行を許可してください
      （<a href="https://support.mozilla.org/kb/extensions-private-browsing" target="_blank" rel="noopener noreferrer">Mozilla の説明</a>）。
    </p>
    <p class="note" id="incognito-status"></p>
  </main>
  <script src="setup.js"></script>
</body>
</html>
