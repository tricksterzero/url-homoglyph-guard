<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="setupTitle"></title>
  <link rel="stylesheet" href="../warning/warning.css">
</head>
<body>
  <main>
    <div class="title">
      <h1 data-i18n="setupTitle"></h1>
    </div>

    <h2 data-i18n="setupHostHeading"></h2>
    <p data-i18n="setupHostText"></p>
    <p class="note" id="host-status"></p>
    <div class="buttons start">
      <button type="button" class="primary" id="grant" data-i18n="grantButton"></button>
    </div>

    <h2 data-i18n="setupIncognitoHeading"></h2>
    <p>
      <span data-i18n="setupIncognitoText"></span>
      <a href="https://support.mozilla.org/kb/extensions-private-browsing" target="_blank" rel="noopener noreferrer"
         data-i18n="setupIncognitoLink"></a>
    </p>
    <p class="note" id="incognito-status"></p>

    <h2 data-i18n="setupMarksHeading"></h2>
    <p data-i18n="setupMarksText"></p>
    <p>
      <label class="checkbox">
        <input type="checkbox" id="warn-on-marks">
        <span data-i18n="setupMarksLabel"></span>
      </label>
    </p>
  </main>
  <script src="../lib/i18n.js"></script>
  <script src="setup.js"></script>
</body>
</html>
