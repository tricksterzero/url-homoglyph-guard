<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>紛らわしいドメイン</title>
  <link rel="stylesheet" href="warning.css">
</head>
<body>
  <main>
    <div class="title">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.5 1.5 21h21Z" fill="var(--icon)"/>
        <path d="M12 9v5.5" stroke="var(--icon-mark)" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="12" cy="17.6" r="1.25" fill="var(--icon-mark)"/>
      </svg>
      <h1 id="title">紛らわしい文字を含むドメインです</h1>
    </div>

    <p class="host" id="unicode-host"></p>
    <p id="summary"></p>

    <dl class="compare">
      <dt id="lookalike-term">似ているドメイン</dt>
      <dd id="lookalike-desc"><span id="lookalike-host"></span></dd>
      <dt>実際のドメイン</dt>
      <dd><code id="ascii-host"></code></dd>
    </dl>

    <div class="buttons">
      <button type="button" id="toggle-details" aria-expanded="false" aria-controls="details">詳細</button>
      <button type="button" class="primary" id="back">戻る（推奨）</button>
    </div>

    <section id="details" hidden>
      <h2>判定の理由</h2>
      <ul id="reasons"></ul>

      <h2>英字以外の文字</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>文字</th><th>コードポイント</th><th>名前</th><th>文字体系</th><th>似ている文字</th></tr>
          </thead>
          <tbody id="chars"></tbody>
        </table>
      </div>

      <h2>開こうとした URL</h2>
      <p><code class="url" id="full-url"></code></p>

      <p class="note" id="proceed-note"></p>
      <div class="buttons start">
        <button type="button" id="proceed">リスクを理解して開く</button>
      </div>
      <p class="error" id="error" hidden></p>
    </section>
  </main>

  <script src="../data/confusables.js"></script>
  <script src="../data/scripts.js"></script>
  <script src="../data/names.js"></script>
  <script src="../lib/punycode.js"></script>
  <script src="../lib/detector.js"></script>
  <script src="warning.js"></script>
</body>
</html>
